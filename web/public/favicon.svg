<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Знак «Смены»: кожаная бирка с монограммой и прострочкой по канту. -->
  <defs>
    <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c06b31"/>
      <stop offset="1" stop-color="#8a4720"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#leather)"/>

  <rect x="5" y="5" width="54" height="54" rx="11" fill="none"
        stroke="#f9f4ec" stroke-opacity="0.5" stroke-width="1.6"
        stroke-dasharray="4 4"/>

  <text x="32" y="45" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700"
        fill="#f9f4ec">С</text>
</svg>
